<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The whole icon, for systems that don't compose it from layers: the mark
       on the standard macOS rounded square (824 px in a 1024 px canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d63f5" />
      <stop offset="1" stop-color="#3f35c9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)" />
  <g transform="translate(512 512) scale(0.8) translate(-523 -536)">
    <g fill="none" stroke="#ffffff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 296 300 H 612 a 106 106 0 0 1 0 212 H 412 a 106 106 0 0 0 0 212 H 580" />
    </g>
    <circle cx="296" cy="300" r="62" fill="#ffffff" />
    <circle cx="512" cy="512" r="62" fill="#ffffff" />
    <circle cx="702" cy="724" r="84" fill="none" stroke="#ffffff" stroke-width="52" />
    <circle cx="702" cy="724" r="26" fill="#ffffff" />
  </g>
</svg>
