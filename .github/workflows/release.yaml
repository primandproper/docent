---
# Builds, signs, notarizes and publishes a release when a version tag is pushed,
# then updates the Homebrew tap.
#
# Secrets this needs:
#   DEVELOPER_ID_P12          the Developer ID Application certificate and key, base64 of the .p12
#   DEVELOPER_ID_P12_PASSWORD the .p12's password
#   DEVELOPER_ID_IDENTITY     e.g. "Developer ID Application: Jane Doe (TEAMID1234)"
#   NOTARY_KEY                an App Store Connect API key, the contents of the .p8
#   NOTARY_KEY_ID             its key id
#   NOTARY_ISSUER_ID          its issuer id
#   TAP_TOKEN                 a token that can push to primandproper/homebrew-tap
on:
  push:
    tags: ['v*']

name: release
jobs:
  release:
    timeout-minutes: 45
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the app
        run: scripts/package.sh "${VERSION}"

      # The certificate lives in a keychain that exists only for this job.
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail

          keychain="${RUNNER_TEMP}/signing.keychain-db"
          password="$(uuidgen)"

          echo "${P12}" | base64 --decode > "${RUNNER_TEMP}/developer-id.p12"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${RUNNER_TEMP}/developer-id.p12" -P "${P12_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -k "${password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}"
          rm "${RUNNER_TEMP}/developer-id.p12"

      - name: Sign
        env:
          IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: scripts/sign.sh "${IDENTITY}"

      - name: Notarize and staple
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          export NOTARY_KEY_PATH="${RUNNER_TEMP}/notary.p8"
          echo "${NOTARY_KEY}" > "${NOTARY_KEY_PATH}"
          scripts/notarize.sh "${VERSION}"
          rm "${NOTARY_KEY_PATH}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${VERSION}" "bin/release/Docent-${VERSION}.zip" --generate-notes --verify-tag

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/primandproper/homebrew-tap.git" "${RUNNER_TEMP}/tap"
          mkdir -p "${RUNNER_TEMP}/tap/Casks"
          scripts/cask.sh "${VERSION}" "bin/release/Docent-${VERSION}.zip" > "${RUNNER_TEMP}/tap/Casks/docent.rb"

          cd "${RUNNER_TEMP}/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/docent.rb
          git commit -m "chore: docent ${VERSION}"
          git push

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
